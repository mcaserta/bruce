name: Docs
# Builds the mdBook docs and, on pushes to main, deploys them to the
# Cloudflare Pages project bruce-docs (https://bruce.mirkocaserta.com).
on:
  push:
    branches:
      - main
    paths:
      - README.md
      - SUMMARY.md
      - essentials/**
      - api/**
      - book.toml
      - scripts/build-docs.sh
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - README.md
      - SUMMARY.md
      - essentials/**
      - api/**
      - book.toml
      - scripts/build-docs.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MDBOOK_VERSION: 0.5.4

jobs:
  docs:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install mdBook
        run: |
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin mdbook
          mdbook --version
      - name: Build
        run: ./scripts/build-docs.sh
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.157.0 pages deploy build/book \
            --project-name=bruce-docs --branch=main \
            --commit-hash="${GITHUB_SHA}" --commit-dirty=true
